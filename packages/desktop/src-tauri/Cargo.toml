[package]
name = "gtmgrid"
version = "0.11.1"
description = "gtmgrid desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Deep-link OAuth callback (C29). single-instance MUST be initialised before the
# deep-link plugin on desktop; the "deep-link" feature wires the two together so a
# `gtmgrid://` URL handed to a second instance is forwarded to the running app.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Open the OAuth authorise URL in the user's SYSTEM browser (not the webview).
tauri-plugin-opener = "2"
# In-app auto-update: download + install a signed newer release. `process` lets
# us relaunch the app after the update is installed.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Required in scope by `generate_context!` once a plugin config (deep-link
# schemes) is present in tauri.conf.json — it deserialises that config at build.
serde_json = "1"

[[bin]]
name = "gtmgrid"
path = "src/main.rs"
