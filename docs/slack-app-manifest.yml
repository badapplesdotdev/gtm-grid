display_information:
  name: GTM Grid (dev)
  description: Programmable GTM spreadsheet - post messages and look up users from a column.
features:
  bot_user:
    display_name: GTM Grid
    always_online: false
oauth_config:
  redirect_urls:
    - https://gtm-grid-web-git-starbase-slack-integration-bad-apples.vercel.app/api/oauth/slack/callback
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  # ROTATION ON: irreversible for this app. This is the config the
  # advisory-lock refresh design exists for.
  token_rotation_enabled: true
