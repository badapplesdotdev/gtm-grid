name: Release

# Cut a release from main: apply pending changesets (semver bump + CHANGELOG),
# tag v<version>, then build the downloadable cross-platform desktop binaries and
# attach them to a published GitHub Release.
#
# Platforms (4): macOS arm64 + macOS Intel + Linux (.deb) + Windows.
# macOS Intel is CROSS-COMPILED on the arm64 runner (macos-13 Intel runners are
# scarce and hung a release): the Rust target is x86_64-apple-darwin and the
# sidecar bundler downloads the x64 node + x64 better-sqlite3 (GTMGRID_SIDECAR_ARCH).
# Windows builds natively (windows-latest); the Rust sidecar spawn + bundler are
# node.exe-aware.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 1. Version cut: consume changesets, bump, tag, push ──────────────────
  version:
    name: Cut version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release (changeset version + sync + tag)
        id: cut
        run: |
          # Require at least one pending changeset (ignore README/config).
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" = "0" ]; then
            echo "::error::No pending changesets — add one with 'pnpm changeset' before releasing."
            exit 1
          fi

          pnpm version-packages

          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          git add -A
          git commit -m "release: ${TAG}"
          git tag "${TAG}"
          git push origin main
          git push origin "${TAG}"

  # ── 2. Build per-platform installers, upload to a draft release ──────────
  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      # Serialize the platform builds. tauri-action's "first job creates the
      # release, the rest upload to it" model is a read-modify-write on both the
      # release assets and `latest.json`: run concurrently, two jobs can clobber
      # each other (e.g. v0.3.10 lost the macOS-Intel + Windows assets AND their
      # `latest.json` entries while every job still reported success). One job at
      # a time means each completes its fetch→merge→upload before the next starts.
      max-parallel: 1
      matrix:
        # `os` drives the per-platform conditionals; `runner` is the runs-on
        # target. The two macOS targets build on the self-hosted Apple-silicon
        # Mac mini (labels: self-hosted + macOS) so the long notarization waits
        # don't consume GitHub-hosted macOS minutes; Linux + Windows stay on
        # GitHub-hosted runners (the mini can't build them).
        include:
          - platform: macOS (Apple silicon)
            os: macos
            runner: [self-hosted, macOS]
            rust_target: aarch64-apple-darwin
            sidecar_arch: ""
            args: "--target aarch64-apple-darwin"
          - platform: macOS (Intel)
            os: macos
            runner: [self-hosted, macOS]
            rust_target: x86_64-apple-darwin
            sidecar_arch: "x64"
            args: "--target x86_64-apple-darwin"
          - platform: Linux
            os: linux
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            sidecar_arch: ""
            # `.deb` only. The AppImage bundler downloads `linuxdeploy-x86_64.AppImage`
            # from tauri-apps/binary-releases at build time, which has been returning
            # persistent HTTP 504s and failing the whole Linux job. The `.deb` needs no
            # external tool download, so Linux ships reliably (re-add `,appimage` once
            # that upstream download is stable).
            args: "--bundles deb"
          - platform: Windows
            os: windows
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_arch: ""
            args: "--bundles nsis"
    runs-on: ${{ matrix.runner }}
    env:
      # True only when the macOS signing + notarization secrets are configured.
      # Lets the signing steps skip cleanly (producing an unsigned build) until
      # the secrets exist, instead of failing the macOS job.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ${{ matrix.rust_target }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # macOS code signing: import the Developer ID Application cert into a
      # temporary keychain BEFORE the build, so BOTH our sidecar codesigning
      # (scripts/bundle-sidecar.mjs, run inside beforeBuildCommand) and Tauri's
      # own .app signing can find the identity. No-op on non-mac runners. The
      # whole step is skipped when the secret is absent so unsigned dev releases
      # still build.
      - name: Import Apple Developer ID certificate
        if: ${{ matrix.os == 'macos' && env.HAS_APPLE_SIGNING == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Notarization uses an App Store Connect API key. Write the .p8 to a file
      # and expose its path to tauri-action via $GITHUB_ENV (APPLE_API_KEY_PATH).
      - name: Stage notarization API key
        if: ${{ matrix.os == 'macos' && env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" | base64 -D > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # tauri-action runs the Tauri build (which runs beforeBuildCommand: build
      # the frontend + bundle the sidecar — including this runner's native node +
      # better-sqlite3), then uploads the installers to the release for this tag.
      # The first matrix job creates the draft release; the others upload to it.
      - name: Build & upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tells scripts/bundle-sidecar.mjs which cpu to bundle the node runtime +
          # better-sqlite3 for. Empty = host arch (native); "x64" = cross-build.
          GTMGRID_SIDECAR_ARCH: ${{ matrix.sidecar_arch }}
          # Prod cloud endpoints baked into the desktop Vite build so the shipped
          # app connects to the live tRPC API + PartyKit realtime + webhook host.
          # Public URLs (not secrets); override via repo Variables if they change.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://www.gtmgrid.dev' }}
          VITE_PARTY_URL: ${{ vars.VITE_PARTY_URL || 'https://gtmgrid-party.iammorganparry.partykit.dev' }}
          VITE_INNGEST_URL: ${{ vars.VITE_INNGEST_URL || 'https://www.gtmgrid.dev' }}
          # Auto-updater signing: with the updater configured + createUpdaterArtifacts
          # on, tauri-action signs each bundle's update archive with this key and
          # publishes `latest.json` to the release. The matching PUBLIC key is in
          # tauri.conf.json; the app verifies updates against it. No password set.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # macOS Developer ID signing + notarization. The cert is already in the
          # keychain (import step above); APPLE_SIGNING_IDENTITY tells Tauri which
          # identity to sign the .app with, and the App Store Connect API key trio
          # (issuer + key id + APPLE_API_KEY_PATH, the last exported to $GITHUB_ENV
          # by "Stage notarization API key") drives notarization. All empty/unused
          # on non-mac runners, so Linux/Windows builds are unaffected.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        with:
          projectPath: packages/desktop
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: GTM Grid ${{ needs.version.outputs.tag }}
          releaseBody: "Download the installer for your platform from the assets below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── 3. Publish the release once all platforms succeed ───────────────────
  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark release published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --latest
