name: Release

# Cut a release from main: apply pending changesets (semver bump + CHANGELOG),
# tag v<version>, then build the Electron desktop installers for every platform
# and publish them (+ electron-updater latest*.yml) to a GitHub Release.
#
# Platforms (4): macOS arm64 + macOS Intel + Linux (AppImage + deb) + Windows (nsis).
# Each builds NATIVELY on its own runner (electron-builder can't cross-build NSIS or
# Linux from macOS): macos-14 (arm64), macos-13 (x64), windows-latest, ubuntu.
# Each runner bundles + rebuilds better-sqlite3 for Electron's ABI on its own arch.
#
# macOS Intel runs as a SEPARATE, NON-BLOCKING job (`build-intel`): the scarce
# macos-13 runner pool can queue for a long time, so `publish` depends only on the
# three fast platforms (`build`) and ships as soon as they're done. The Intel .dmg
# uploads to the same release (`--publish always`) whenever its runner frees — even
# if that's after the release is already public.

on:
  workflow_dispatch:

permissions:
  contents: write

# NOTE: concurrency is scoped to the VERSION job only (below), NOT the whole
# workflow. A workflow-level group serialized entire runs — and because the
# non-blocking macOS Intel job keeps a run "in progress" until its scarce macos-13
# runner frees, a stuck Intel job would block the NEXT release indefinitely. We only
# need to serialize the version cut (changeset bump + tag push must not race); the
# build jobs are keyed to their own tag and are safe to overlap.

jobs:
  # ── 0. Test gate: NOTHING is released unless lint + typecheck + the full unit
  # suite pass on main. Electron E2E is the required local pre-PR gate documented
  # in AGENTS.md; keeping it out of Actions avoids repeating the multi-minute
  # desktop run during both PR validation and release.
  gate:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck & unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

  # ── 1. Version cut: consume changesets, bump, tag, push ──────────────────
  version:
    name: Cut version
    needs: gate
    runs-on: ubuntu-latest
    # Serialize ONLY the version cut so two releases can't race the tag/push.
    concurrency:
      group: release-version
      cancel-in-progress: false
    outputs:
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cut release (changeset version + sync + tag)
        id: cut
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" = "0" ]; then
            echo "::error::No pending changesets — add one with 'pnpm changeset' before releasing."
            exit 1
          fi
          pnpm version-packages
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "release: ${TAG}"
          git tag "${TAG}"
          git push origin main
          git push origin "${TAG}"

  # ── 2. Build + publish per-platform Electron installers ──────────────────
  # The three RELIABLE platforms that `publish` waits on. macOS Intel is split into
  # the separate non-blocking `build-intel` job below (scarce macos-13 runners).
  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS (Apple silicon)
            os: macos
            runner: macos-14
            arch_flag: "--arm64"
          - platform: Linux
            os: linux
            runner: ubuntu-22.04
            arch_flag: "--x64"
          - platform: Windows
            os: windows
            runner: windows-latest
            arch_flag: "--x64"
    runs-on: ${{ matrix.runner }}
    env:
      # True only when the macOS signing + notarization secrets are configured, so
      # signing steps skip cleanly (unsigned build) until the secrets exist.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # macOS notarization key → a file electron-builder/@electron/notarize reads.
      - name: Stage notarization API key
        if: ${{ matrix.os == 'macos' && env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" | base64 -D > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Build: vite renderer → bundle sidecar (esbuild + better-sqlite3 rebuilt for
      # this runner's Electron ABI/arch) → esbuild main → electron-builder publish.
      - name: Build & publish Electron app
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prod cloud endpoints + PostHog key baked into BOTH the vite renderer and
          # the electron main (plain-JS define — no cargo cache, unlike Tauri).
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://www.gtmgrid.dev' }}
          VITE_PARTY_URL: ${{ vars.VITE_PARTY_URL || 'https://gtmgrid-party.iammorganparry.partykit.dev' }}
          VITE_INNGEST_URL: ${{ vars.VITE_INNGEST_URL || 'https://www.gtmgrid.dev' }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          # macOS code signing (Developer ID) — electron-builder reads CSC_LINK /
          # CSC_KEY_PASSWORD. The APPLE_API_* trio (key path staged above) drives
          # notarization. MUST be gated on the mac runners: these are repo secrets
          # present on EVERY runner, so handing the Apple .p12 to electron-builder on
          # Windows makes it sign the NSIS installer with the Apple Developer ID cert
          # — which Windows doesn't trust, so electron-updater rejects the download
          # and Windows auto-update breaks for everyone. Keep them empty off-mac.
          CSC_LINK: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos' && env.HAS_APPLE_SIGNING == 'true' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm build
          pnpm electron:bundle
          pnpm electron:main
          pnpm exec electron-builder --${{ matrix.os == 'windows' && 'win' || matrix.os == 'linux' && 'linux' || 'mac' }} ${{ matrix.arch_flag }} --publish always

  # ── 2b. macOS Intel — SEPARATE, NON-BLOCKING job. The scarce macos-13 runner can
  # queue a long time, so `publish` does NOT depend on this: the release ships on the
  # 3 fast platforms and the Intel .dmg/.zip attach whenever Intel finishes — even
  # after the release is already public. Intel installers are uploaded MANUALLY
  # (not `--publish always`) so they never clobber the arm64 `latest-mac.yml`
  # auto-update feed (separate-runner mac builds each emit their own channel file;
  # the arm64 majority's feed must win).
  build-intel:
    name: Build macOS (Intel)
    needs: version
    runs-on: macos-13
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage notarization API key
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" | base64 -D > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build (signed + notarized) Intel app
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://www.gtmgrid.dev' }}
          VITE_PARTY_URL: ${{ vars.VITE_PARTY_URL || 'https://gtmgrid-party.iammorganparry.partykit.dev' }}
          VITE_INNGEST_URL: ${{ vars.VITE_INNGEST_URL || 'https://www.gtmgrid.dev' }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_APPLE_SIGNING == 'true' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm build
          pnpm electron:bundle
          pnpm electron:main
          pnpm exec electron-builder --mac --x64 --publish never
      - name: Attach Intel installers (no channel file — preserve the arm64 updater feed)
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" release/*x64* --clobber

  # ── 3. Publish the release once the 3 fast platforms succeed (NOT Intel) ──
  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark release published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --latest
