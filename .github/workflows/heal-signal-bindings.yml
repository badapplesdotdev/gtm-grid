name: Heal signal bindings

# One-time data fix (TRI: cloud signal tables stayed empty): bindings created
# before the lastSyncedAt stamping fix have last_synced_at set despite never
# having pulled a row, so the hourly cron won't consider them due until a full
# schedule interval after creation. Nulling last_synced_at for never-pulled
# bindings makes them due on the next hourly tick (the due-predicate's
# `last_synced_at IS NULL` branch), so existing empty tables fill without being
# recreated.
#
# Deliberately a FIXED statement — no inputs — so this workflow can never be
# used to run arbitrary SQL against prod. Requires the `PROD_DATABASE_URL`
# repository secret (same as migrate-prod.yml). Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heal:
    name: Null last_synced_at for never-pulled bindings
    runs-on: ubuntu-latest
    steps:
      - name: Run the fixed heal statement
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set."
            exit 1
          fi
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -c \
            "UPDATE signal_bindings SET last_synced_at = NULL WHERE (rows_pulled = 0 OR rows_pulled IS NULL) AND last_synced_at IS NOT NULL;"
