name: Windows smoke

# Boot the bundled engine sidecar on a real Windows x64 box (GitHub-hosted) and
# require /api/health — WITHOUT cutting a release or needing a Windows VM. This is
# the cheap, on-demand guard for the failure that hit a Windows user: the bundled
# engine (the better-sqlite3 native binding, the copied node runtime) failing to
# load on Windows, which leaves the app stuck on "Server not reachable".
#
# It bundles the sidecar (esbuild + `npm install` of the native deps + the copied
# `node.exe`) and runs scripts/smoke-sidecar.mjs against it. No Rust toolchain and
# no full Tauri build, so it finishes in a few minutes. Linux runs alongside for
# parity. (The release workflow runs the same smoke on the real release bundle;
# this one gives fast PR-time + click-to-run feedback.)
#
# What this does NOT cover: SmartScreen/Defender quarantine of the unsigned
# installer (CI Defender is relaxed) — the fix for that is code-signing the
# Windows build, not a test. This catches the native-load class, which is the
# most likely culprit.

on:
  # Click "Run workflow" in the Actions tab to test on demand — your Windows box
  # in the cloud, no VM to provision or pay for.
  workflow_dispatch:
  # Auto-run on PRs that touch the engine, its deps, or the bundling/smoke scripts.
  pull_request:
    paths:
      - "packages/**"
      - "extensions/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-smoke.yml"

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Sidecar smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bundle the self-contained sidecar exactly as the packaged app ships it:
      # esbuild the server/mcp, `npm install` the native deps (better-sqlite3
      # prebuilt for this host arch), and copy this runner's node(.exe).
      - name: Bundle sidecar
        run: node packages/desktop/scripts/bundle-sidecar.mjs

      # Boot that bundle and require /api/health — fails (printing the sidecar's
      # captured output) if the native module won't load or the engine never binds.
      - name: Smoke-test bundled sidecar
        run: node packages/desktop/scripts/smoke-sidecar.mjs
