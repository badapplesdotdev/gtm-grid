name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per branch/PR; a newer push cancels the older in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm BEFORE setup-node so setup-node's pnpm cache can find it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fast, fail-early gates first.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Unit/integration tests (vitest across all packages; in-memory, no DB).
      - name: Test
        run: pnpm test

      # Build the web app so a broken `next build` (bad route, server-component
      # error, missing env reference) is caught in CI instead of at release time.
      # The PostHog public vars come from repo Variables; unset → analytics degrade
      # gracefully (build still passes), so this is safe in forks too.
      - name: Build web
        run: pnpm --filter @gtmgrid/web build
        env:
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
